name: Prepare package versions

on:
  push:
    branches: [main]
    paths: [".changeset/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: version-prepare
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'beachside-compute/credential-broker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: changesets
        name: Create or update version PR
        uses: changesets/action@v2
        with:
          version-script: bun run release:version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
      - name: Run CI on the version PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          set -euo pipefail
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"
